[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "anchorlogit"
version = "0.1.0"
description = "Ridge logistic regression that starts from a reference log-odds: offsets, fractional offsets and anchored coefficients for scikit-learn"
requires-python = ">=3.10"
license = "PolyForm-Noncommercial-1.0.0"
authors = [{ name = "Moussa Ouallaf" }]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.4",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
test = ["pytest>=7", "pandas>=1.5"]
twins = ["statsmodels>=0.14", "glum>=2.6"]
dev = ["anchorlogit[test,twins]"]

[tool.setuptools.packages.find]
include = ["anchorlogit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
